# Chinese (Simplified) edition. Built into `book/html/zh/` by scripts/build.sh,
# so it must be built after the root book (which clears `book/html/`).
[book]
authors = ["Morg"]
language = "zh-CN"
src = "src"
title = "Yokubi 中文版"

[build]
build-dir = "../book/html/zh"

[output.html]
default-theme = "Navy"
additional-js = ["js/lunr.stemmer.support.js", "js/tinyseg.js", "js/lunr.jp.js", "js/lunr.multi.js", "js/load-lunr-plugin.js", "js/language-switcher.js"]
additional-css = ["style/custom.css"]
no-section-label = true

[output.html.fold]
enable = true

[output.html.search]
use-boolean-and = true   # multiple search terms combined with AND opposed to OR

[preprocessor.furigana]
command = "python scripts/preprocess-furigana.py"
renderers = ["html"]
